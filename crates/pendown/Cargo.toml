[package]
name = "pendown"
description = "Pendown: a Logo playground where you can watch the turtle think"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
image.workspace = true
# Draws the help panel's pictures of examples (phase 5).
pendown-cli.workspace = true
pendown-logo.workspace = true
pendown-render.workspace = true

[dev-dependencies]
# Renders exported SVGs back into pixels, to compare with the PNG. The
# version gpui already uses, so it adds nothing to build.
resvg = { version = "0.46", default-features = false }
