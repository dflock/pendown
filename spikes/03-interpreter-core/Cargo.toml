[package]
name = "pendown-logo"
version = "0.0.0"
edition = "2024"
publish = false

# Spike: see .scratch/phase-1-spikes/issues/03-interpreter-core.md. This may
# become the start of the real `pendown-logo` crate (ADR 0019).
[workspace]

[dependencies]
smallvec = "1"

[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.pendown-logo]
# Unoptimised, a call can use 43 KB of stack, so 256 MB holds only about 6,000
# nested calls. At opt-level 1 it is about 5 KB, as in release.
opt-level = 1
